name: atlantida_mobile
description: "Atlantida pet shop app."
publish_to: "none"

version: 1.0.0+3

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.5.0
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.2
  flutter_svg: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/env/.env
    - assets/images/
    - assets/images/icons_category/

flutter_launcher_icons:
  android: true
  ios: true
  min_sdk_android: 21
  image_path: "assets/images/launcher/icon_foreground.png"
  adaptive_icon_background: "assets/images/launcher/icon_background.png"
  adaptive_icon_foreground: "assets/images/launcher/icon_foreground.png"
